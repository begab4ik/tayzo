services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tayzo
      POSTGRES_PASSWORD: tayzo
      POSTGRES_DB: tayzo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tayzo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
      - tokens.env
    environment:
      DATABASE_URL: postgresql+asyncpg://tayzo:tayzo@postgres:5432/tayzo
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # HTTPS-прокси: сам получает сертификат Let's Encrypt для домена из .env (DOMAIN=...)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SITE_DOMAIN: ${SITE_DOMAIN:-tayzo.uz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - bot

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
